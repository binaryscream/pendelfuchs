# Xcode-Projekt wird aus dieser Datei erzeugt:  xcodegen generate
name: FahrplanXL
options:
  bundleIdPrefix: de.fahrplanxl
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: de

packages:
  FahrplanKit:
    path: Packages/FahrplanKit
  # Kartenansicht (Open Source, BSD-2-Clause). Kartendaten: OpenFreeMap / OpenStreetMap.
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.31.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signier-Team. Wer das Projekt selbst baut, trägt hier sein eigenes Team ein.
    DEVELOPMENT_TEAM: 6QR5T4RM6V

targets:
  FahrplanXL:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: FahrplanKit
      - package: MapLibre
      - target: FahrplanXLWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: de.fahrplanxl.app
            CFBundleURLSchemes:
              - fahrplanxl
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - de.fahrplanxl.app.refresh
        CFBundleDisplayName: Pendelfuchs
        # So, wie Siri „Pendelfuchs“ oft versteht – damit Sätze mit dem App-Namen nicht bei anderen Apps landen.
        INAlternativeAppNames:
          - INAlternativeAppName: Pendel Fuchs
            INAlternativeAppNamePronunciationHint: Pendel Fuchs
          - INAlternativeAppName: Pendlerfuchs
            INAlternativeAppNamePronunciationHint: Pendler Fuchs
          - INAlternativeAppName: Pendelfux
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: de
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: Pendelfuchs zeigt dir Haltestellen in deiner Nähe. Dein Standort wird nur zur Haltestellensuche an den Fahrplandienst übertragen.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/FahrplanXL.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.fahrplanxl.app
        # Für dringliche Meldungen, die einen Fokus durchbrechen, bräuchte es zusätzlich
        #   com.apple.developer.usernotifications.time-sensitive: true
        # Das erlaubt Apple nur mit bezahltem Entwicklerkonto – mit dem kostenlosen schlägt der Build fehl.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.fahrplanxl.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

  # Widget-Erweiterung: Live-Aktivität (Sperrbildschirm, Dynamic Island), später Home-Screen-Widgets
  FahrplanXLWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    dependencies:
      - package: FahrplanKit
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Pendelfuchs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/FahrplanXLWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.fahrplanxl.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.fahrplanxl.app.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
